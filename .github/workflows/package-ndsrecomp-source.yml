name: package-ndsrecomp-source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-ndsrecomp-source.yml'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research repo
        uses: actions/checkout@v4

      - name: Checkout pinned ndsrecomp
        uses: actions/checkout@v4
        with:
          repository: RetroPortingToolKit/ndsrecomp
          ref: 3a57236bb23d25dcb4caad7d58d733311062ff5e
          submodules: recursive
          path: ndsrecomp

      - name: Checkout pinned recomp-ui
        uses: actions/checkout@v4
        with:
          repository: RetroPortingToolKit/recomp-ui
          ref: 7e884a227accea91ddb378671bd49aaeeea13371
          submodules: recursive
          path: recomp-ui

      - name: Configure recompiler
        run: cmake -S ndsrecomp/recompiler -B build/recompiler -DCMAKE_BUILD_TYPE=Release

      - name: Build nds_recompile
        run: cmake --build build/recompiler --target nds_recompile --parallel 2

      - name: Generate public FreeBIOS banks
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p public-generated
          R=build/recompiler/nds_recompile
          FB9=ndsrecomp/third_party/freebios/drastic_bios_arm9.bin
          FB7=ndsrecomp/third_party/freebios/drastic_bios_arm7.bin
          "$R" --config ndsrecomp/bios/freebios9.toml --bin "$FB9" --out public-generated --bank freebios_arm9
          "$R" --config ndsrecomp/bios/freebios7.toml --bin "$FB7" --out public-generated --bank freebios_arm7
          # Current runner CMake always names retail BIOS bank objects even when
          # runtime selection is --freebios. Supply link-only placeholders generated
          # from public FreeBIOS. In --freebios mode these retail-named tables are
          # never registered or executed.
          "$R" --config ndsrecomp/bios/freebios9.toml --bin "$FB9" --out public-generated --bank arm9_bios
          "$R" --config ndsrecomp/bios/freebios7.toml --bin "$FB7" --out public-generated --bank arm7_bios

      - name: Stage source package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package/ndsrecomp package/recomp-ui package/generated-public
          rsync -a --exclude='.git' ndsrecomp/ package/ndsrecomp/
          rsync -a --exclude='.git' recomp-ui/ package/recomp-ui/
          cp -a public-generated/. package/generated-public/
          cat > package/PIN.txt <<'EOF'
          ndsrecomp=3a57236bb23d25dcb4caad7d58d733311062ff5e
          arm-recomp-core=705e71b8aff3ad64fe78f77c3c94bd93158554dd
          freebios=6d6cfb4953924e4abdaa130aedf71826a055508e
          recomp-ui=7e884a227accea91ddb378671bd49aaeeea13371
          EOF

      - name: Upload public source package
        uses: actions/upload-artifact@v4
        with:
          name: ndsrecomp-source-directboot-3a57236
          path: package/
          if-no-files-found: error
          retention-days: 7
